<script>

/* 평균 연봉(만 원)
   출처: 커리어넷 직업정보 '평균연봉(중앙값)' ← 워크넷(한국고용정보원) 2021년 재직자 조사

   "nodata" = 공식 자료에 해당 직업의 값이 없음 */

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 캐릭터 그림이 있으면 그림을, 없으면 이모지를 보여 줍니다.
function jobIcon(j) {
  return j.image
    ? `<img class="job-img" src="${j.image}" alt="">`
    : `<span class="emoji" aria-hidden="true">${j.emoji}</span>`;
}

function salaryText(id) {
  const s = SALARY[id];
  if (s === "none") return "소득 차이가 매우 커서 평균을 정하기 어려워요";
  if (typeof s !== "number") return "공식 자료에 평균 연봉 정보가 없어요";
  if (s >= 10000) {
    const man = s % 10000;
    return `평균 약 ${Math.floor(s / 10000)}억${man ? ` ${man.toLocaleString("ko-KR")}만` : ""} 원`;
  }
  return `평균 약 ${s.toLocaleString("ko-KR")}만 원`;
}

/* =========================================================
   화면 그리기
   ========================================================= */
function renderCards() {
  $("#card-groups").innerHTML = CATEGORIES.map(cat => `
    <h3 class="group-title">${cat.name}</h3>
    <div class="grid">
      ${cat.ids.map(id => {
        const j = JOBS[id];
        return `<button class="card${state.seen.has(id) ? " seen" : ""}" data-go="job/${id}">
          <span class="check">✔ 봤어요</span>
          ${jobIcon(j)}
          <span>${j.name}</span>
        </button>`;
      }).join("")}
    </div>`).join("");
  $("#seen-count").textContent = `(살펴본 직업 ${state.seen.size} / ${ORDER.length})`;
}

function renderJob(id) {
  const j = JOBS[id];
  const cat = CATEGORIES.find(c => c.ids.includes(id));
  state.seen.add(id);

  $("#detail").innerHTML = `
    <div class="detail-head">
      ${jobIcon(j)}
      <div>
        <span class="tag">${cat.name}</span>
        <h2>${j.name}</h2>
      </div>
    </div>
    <dl class="info">
      <div class="info-row"><dt>🛠️ 하는 일</dt><dd>${j.task}</dd></div>
      <div class="info-row"><dt>💰 연봉</dt><dd>${salaryText(id)}<span class="sub">${j.salaryNote}</span></dd></div>
      <div class="info-row"><dt>👍 장점</dt><dd>${j.pros}</dd></div>
      <div class="info-row"><dt>🤔 단점</dt><dd>${j.cons}</dd></div>
      <div class="info-row"><dt>💪 필요한 능력</dt><dd><div class="skills">${j.skills.map(s => `<span>${s}</span>`).join("")}</div></dd></div>
    </dl>
    <p class="note">※ 연봉은 ${SALARY_SOURCE} 자료의 평균값(중앙값)으로, 참고용이에요.
      같은 직업이라도 경력·근무처 등에 따라 받는 돈은 많이 달라요.</p>`;

  $("#job-select").value = id;
  const i = ORDER.indexOf(id);
  const prev = ORDER[(i - 1 + ORDER.length) % ORDER.length];
  const next = ORDER[(i + 1) % ORDER.length];
  $("#prev-job").dataset.go = `job/${prev}`;
  $("#next-job").dataset.go = `job/${next}`;
  $("#prev-job").textContent = `◀ ${JOBS[prev].name}`;
  $("#next-job").textContent = `${JOBS[next].name} ▶`;
  $("#job-quiz").dataset.go = `quiz/${id}`;
  $("#job-quiz").textContent = `🧩 ${j.name} 퀴즈 풀기`;
}

function newQuiz(jobId) {
  const byJob = id => shuffle(QUIZ_BANK.filter(q => q.jobId === id));
  let picked;
  if (jobId) {
    // 한 직업 퀴즈: 그 직업의 5문제
    picked = byJob(jobId).slice(0, QUIZ_SIZE);
  } else {
    // 섞어 풀기: 살펴본 직업에서 돌아가며 한 문제씩 뽑고, 모자라면 다른 직업에서 한 문제씩 채웁니다.
    const pools = shuffle([...state.seen]).map(byJob);
    picked = [];
    while (picked.length < QUIZ_SIZE && pools.some(p => p.length)) {
      for (const p of pools) if (p.length && picked.length < QUIZ_SIZE) picked.push(p.shift());
    }
    for (const id of shuffle(ORDER.filter(id => !state.seen.has(id)))) {
      if (picked.length >= QUIZ_SIZE) break;
      picked.push(byJob(id)[0]);
    }
    picked = shuffle(picked);
  }
  const questions = picked.map(q => ({ ...q, order: shuffle(q.choices.map((_, i) => i)) }));
  state.quiz = { jobId: jobId || null, questions, index: 0, score: 0, answered: false };
}

function renderQuiz() {
  const quiz = state.quiz;
  const q = quiz.questions[quiz.index];

  $("#quiz-progress").innerHTML = quiz.questions
    .map((_, i) => `<span class="${i < quiz.index || (i === quiz.index && quiz.answered) ? "done" : ""}"></span>`).join("");
  const job = JOBS[q.jobId];
  $("#quiz-count").textContent = `${job.emoji} ${quiz.jobId ? `${job.name} 퀴즈` : job.name} · ${quiz.index + 1} / ${QUIZ_SIZE} 문제`;
  $("#quiz-q").textContent = q.q;
  $("#choices").innerHTML = q.order.map((c, n) => `
    <button class="choice" data-choice="${c}">
      <span class="num">${"①②③④"[n]}</span><span>${q.choices[c]}</span><span class="mark"></span>
    </button>`).join("");
  $("#feedback").hidden = true;
  $("#quiz-next").hidden = true;
}

function answerQuiz(choice) {
  const quiz = state.quiz;
  if (quiz.answered) return;
  quiz.answered = true;
  const q = quiz.questions[quiz.index];
  const correct = choice === 0;
  if (correct) quiz.score++;

  document.querySelectorAll(".choice").forEach(btn => {
    const c = Number(btn.dataset.choice);
    btn.disabled = true;
    if (c === 0) { btn.classList.add("correct"); btn.querySelector(".mark").textContent = "⭕ 정답"; }
    else if (c === choice) { btn.classList.add("wrong"); btn.querySelector(".mark").textContent = "❌"; }
  });

  const fb = $("#feedback");
  fb.className = `feedback ${correct ? "ok" : "no"}`;
  fb.innerHTML = `<strong>${correct ? "⭕ 정답이에요!" : `❌ 아쉬워요. 정답: “${q.choices[0]}”`}</strong>${q.explain}`;
  fb.hidden = false;

  document.querySelectorAll("#quiz-progress span")[quiz.index].classList.add("done");
  const last = quiz.index === QUIZ_SIZE - 1;
  const nextBtn = $("#quiz-next");
  nextBtn.textContent = last ? "결과 보기 🎉" : "다음 문제 ▶";
  nextBtn.hidden = false;
  nextBtn.focus();
}

function renderResult() {
  const { score, jobId } = state.quiz;
  const title = jobId ? `${JOBS[jobId].name} 퀴즈` : "퀴즈";
  $("#score").textContent = `${title} ${QUIZ_SIZE}문제 중 ${score}문제 정답 · 살펴본 직업 ${state.seen.size}개`;
}

/* =========================================================
   화면 이동 (주소의 # 부분으로 구분 → 브라우저 뒤로 가기 지원)
   ========================================================= */
function show(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === `screen-${name}`));
  $("#topbar").hidden = name === "home";
  window.scrollTo(0, 0);
}

function route() {
  const [page, arg] = location.hash.slice(1).split("/");
  if (page === "jobs") { renderCards(); show("jobs"); }
  else if (page === "job" && JOBS[arg]) { renderJob(arg); show("job"); }
  else if (page === "quiz") {
    const jobId = JOBS[arg] ? arg : null;
    if (!state.quiz || state.quiz.done || state.quiz.jobId !== jobId) newQuiz(jobId);
    renderQuiz(); show("quiz");
  }
  else if (page === "result" && state.quiz && state.quiz.done) { renderResult(); show("result"); }
  else { show("home"); }
}

function go(target) {
  if (location.hash === `#${target}`) route();
  else location.hash = target;
}

document.addEventListener("click", e => {
  const goBtn = e.target.closest("[data-go]");
  if (goBtn) { go(goBtn.dataset.go); return; }
  const choiceBtn = e.target.closest(".choice");
  if (choiceBtn) answerQuiz(Number(choiceBtn.dataset.choice));
});

$("#quiz-next").addEventListener("click", () => {
  const quiz = state.quiz;
  if (quiz.index === QUIZ_SIZE - 1) { quiz.done = true; go("result"); }
  else { quiz.index++; quiz.answered = false; renderQuiz(); }
});

$("#retry-quiz").addEventListener("click", () => {
  const jobId = state.quiz && state.quiz.jobId;
  state.quiz = null;
  go(jobId ? `quiz/${jobId}` : "quiz");
});

$("#job-select").innerHTML = CATEGORIES.map(cat =>
  `<optgroup label="${cat.name}">${cat.ids.map(id => `<option value="${id}">${JOBS[id].emoji} ${JOBS[id].name}</option>`).join("")}</optgroup>`
).join("");
$("#job-select").addEventListener("change", e => go(`job/${e.target.value}`));

window.addEventListener("hashchange", route);
route();
</script>
</body>
